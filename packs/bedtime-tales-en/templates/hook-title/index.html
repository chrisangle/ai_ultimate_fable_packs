<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Bedtime Tales · Hook Title · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink-cream: #fef3c7;
    --pack-eyebrow: #fbbf24;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #2d1b52 0%, #1a1330 70%, #0d0820 100%);
    color: var(--pack-ink-cream);
    font-family: "Fraunces", Georgia, serif;
  }
  .stars { position: absolute; inset: 0; overflow: hidden; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.5); opacity: 0.85;
    animation: twinkle 3s ease-in-out infinite;
  }
  .star.slow { animation-duration: 5s; }
  .star.fast { animation-duration: 2s; }
  @keyframes twinkle {
    0%,100% { opacity: 0.85; }
    50%     { opacity: 0.35; }
  }
  .moon {
    position: absolute; right: 180px; top: 140px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fef9c3 0%, #fde68a 60%, #ca8a04 100%);
    box-shadow: 0 0 80px rgba(254, 240, 138, 0.35);
    animation: float-moon 8s ease-in-out infinite;
  }
  @keyframes float-moon {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-14px); }
  }
  .book {
    position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
    width: 900px; height: 640px; border-radius: 14px;
    background: linear-gradient(180deg, #5b21b6 0%, #4c1d95 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.15);
    display: flex; align-items: center; justify-content: center; padding: 80px;
    animation: enter 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translate(-50%, -46%) scale(0.94); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .title {
    color: var(--pack-ink-cream);
    font-size: 92px; font-weight: 700; text-align: center; line-height: 1.15;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  .kicker {
    color: var(--pack-eyebrow);
    font-size: 28px; font-weight: 500; letter-spacing: 8px; text-transform: uppercase;
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    animation: fade-down 0.9s ease-out both;
  }
  @keyframes fade-down {
    from { opacity: 0; transform: translate(-50%, -12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .caption {
    position: absolute; left: 50%; bottom: var(--pack-safe); transform: translateX(-50%);
    color: #fef9c3;
    font-size: 32px; font-weight: 500; font-style: italic;
    max-width: calc(1920px - 2 * var(--pack-safe));
    text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="hook-title"
       data-start="0"
       data-duration="8"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"kicker":"A Bedtime Tale","title":"Once upon a time…","voiceText":"Gather round for tonight\u0027s story."}'>
    <div class="stars">
      <div class="star" style="left:12%; top:15%"></div>
      <div class="star slow" style="left:28%; top:28%; width:2px; height:2px;"></div>
      <div class="star" style="left:44%; top:8%"></div>
      <div class="star fast" style="left:78%; top:35%; width:4px; height:4px;"></div>
      <div class="star" style="left:88%; top:75%"></div>
      <div class="star slow" style="left:16%; top:70%; width:2px; height:2px;"></div>
      <div class="star" style="left:60%; top:20%"></div>
      <div class="star fast" style="left:35%; top:82%"></div>
    </div>
    <div class="moon" data-slot="moon" data-user-hideable="true"></div>
    <div class="kicker" data-slot="kicker">A Bedtime Tale</div>
    <div class="book">
      <div class="title" data-slot="title" data-user-editable="position">Once upon a time…</div>
    </div>
    <div class="caption" data-slot="voiceText" data-user-editable="position">Gather round for tonight's story.</div>
  </div>
  <script>
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  
    // populate [data-slot="key"]
    Object.entries(V).forEach(([k, v]) => {
      if (k.startsWith('__')) return;
      document.querySelectorAll('[data-slot="' + k + '"]').forEach(el => { el.textContent = (v == null ? '' : String(v)); });
    });
  
    // auto character badges
    ['characterName','leftName','rightName'].forEach(k => {
      if (!V[k]) return;
      if (!document.querySelector('[data-slot="' + k + '"]')) {
        const el = document.createElement('div');
        el.className = 'auto-char-badge auto-' + k;
        el.textContent = V[k];
        document.getElementById('root').appendChild(el);
      }
    });
  
    window.__timelines = window.__timelines || {};
    const cid = (document.getElementById('root') || {}).getAttribute && document.getElementById('root').getAttribute('data-composition-id') || 'default';
    window.__timelines[cid] = { start: function(){}, stop: function(){} };
  })();
  
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const O = V.__overrides || {};
  
    const ANCHOR = {
      'top-left':      { left:'0%',  top:'0%',   transform:'' },
      'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
      'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
      'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
      'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
      'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
      'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
      'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
      'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    };
  
    Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
      const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
      if (!el) return;
      const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
      // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
      // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
      // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
      const w = el.getBoundingClientRect().width;
      // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
      // normal inline style (CSS cascade order: important author > animations > normal author), so
      // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
      const set = (prop, value) => el.style.setProperty(prop, value, 'important');
      if (w > 0) set('width', w + 'px');
      set('position', 'absolute');
      set('left', a.left);
      set('top', a.top);
      set('right', 'auto');
      set('bottom', 'auto');
      set('transform', a.transform || 'none');
      set('margin-left', (pos.offsetX||0) + 'px');
      set('margin-top', (pos.offsetY||0) + 'px');
    });
  
    (O.hiddenSlots || []).forEach(slotId => {
      document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
        .forEach(el => { el.style.display = 'none'; });
    });
  
    const img = O.image;
    if (img && img.assetPath) {
      let host = document.querySelector('[data-slot="fable-image"]');
      if (!host) {
        host = document.createElement('div');
        host.setAttribute('data-slot','fable-image');
        host.setAttribute('data-slot-type','image');
        Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
        document.getElementById('root').prepend(host);
      }
      const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
      const fit = img.fit || 'cover';
      host.innerHTML = '<img src="' + img.assetPath + '" style="width:100%;height:100%;object-fit:' + fit + ';opacity:' + opacity + '">';
      if (img.kenBurns) host.classList.add('fable-image-kenburns');
    }
  })();
  </script>
</body>
</html>
