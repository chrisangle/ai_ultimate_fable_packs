<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bedtime Tales — Hook Title</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');
  body { margin: 0; background: #1a1330; font-family: 'Fraunces', Georgia, serif; overflow: hidden; }
  .stage { width: 1920px; height: 1080px; position: relative;
    background: radial-gradient(ellipse at 50% 40%, #2d1b52 0%, #1a1330 70%, #0d0820 100%); }
  .stars { position: absolute; inset: 0; overflow: hidden; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.5); opacity: 0.8;
  }
  .moon {
    position: absolute; right: 180px; top: 140px; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fef9c3 0%, #fde68a 60%, #ca8a04 100%);
    box-shadow: 0 0 80px rgba(254,240,138,0.35);
  }
  .book {
    position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
    width: 900px; height: 640px; border-radius: 14px;
    background: linear-gradient(180deg, #5b21b6 0%, #4c1d95 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; padding: 80px;
  }
  .title { color: #fef3c7; font-size: 92px; font-weight: 700; text-align: center; line-height: 1.15;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .kicker { color: #fbbf24; font-size: 28px; font-weight: 500; letter-spacing: 8px; text-transform: uppercase;
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%); }
  .caption { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%);
    color: #fef9c3; font-size: 32px; font-weight: 500; font-style: italic; max-width: 1400px;
    text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
</style>
</head>
<body>
  <div class="stage" data-composition-duration="8">
    <div class="stars">
      <div class="star" style="left:12%; top:15%"></div>
      <div class="star" style="left:28%; top:28%; width:2px; height:2px;"></div>
      <div class="star" style="left:44%; top:8%"></div>
      <div class="star" style="left:78%; top:35%; width:4px; height:4px;"></div>
      <div class="star" style="left:88%; top:75%"></div>
      <div class="star" style="left:16%; top:70%; width:2px; height:2px;"></div>
      <div class="star" style="left:60%; top:20%"></div>
      <div class="star" style="left:35%; top:82%"></div>
    </div>
    <div class="moon"></div>
    <div class="kicker" data-composition-variable="kicker">A Bedtime Tale</div>
    <div class="book">
      <div class="title" data-composition-variable="title">Once upon a time…</div>
    </div>
    <div class="caption" data-composition-variable="voiceText">Gather round for tonight's story.</div>
  </div>
</body>
</html>
