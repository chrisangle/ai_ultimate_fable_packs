<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Bedtime Tales · Character Moment · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-paper: #fffbeb;
    --pack-ink-body: #422006;
    --pack-ink-dark: #78350f;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #fef3c7 0%, #fde68a 45%, #fbbf24 100%);
    color: var(--pack-ink-body);
    font-family: "Fraunces", Georgia, serif;
  }
  .warm-glow {
    position: absolute; inset: -80px;
    background: radial-gradient(ellipse at 30% 40%, rgba(255, 236, 179, 0.7), transparent 55%);
    filter: blur(20px);
    animation: glow 6s ease-in-out infinite;
  }
  @keyframes glow { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
  .portrait {
    position: absolute; left: 260px; top: 50%; transform: translateY(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fde68a, #f97316 70%, #7c2d12);
    box-shadow: 0 40px 100px rgba(120, 53, 15, 0.35), inset 0 0 80px rgba(255, 255, 255, 0.25);
    display: flex; align-items: center; justify-content: center;
    animation: bloom 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes bloom {
    from { opacity: 0; transform: translateY(-46%) scale(0.85); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
  }
  .portrait .face {
    font-size: 220px; line-height: 1; filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.25));
  }
  .text-block {
    position: absolute; right: var(--pack-safe); top: 50%; transform: translateY(-50%);
    width: 900px;
  }
  .name {
    color: var(--pack-ink-dark); font-size: 32px; font-weight: 500;
    letter-spacing: 8px; text-transform: uppercase;
    margin-bottom: 20px;
    animation: fade-up 0.9s ease-out both 0.6s;
  }
  .heading {
    color: var(--pack-ink-body); font-size: 76px; font-weight: 700; line-height: 1.15;
    margin-bottom: 32px;
    animation: fade-up 1s ease-out both 0.9s;
  }
  .body-copy {
    color: var(--pack-ink-body); font-size: 34px; font-weight: 500; line-height: 1.5;
    animation: fade-up 1s ease-out both 1.2s;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="character-moment"
       data-start="0"
       data-duration="10"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"name":"THE BAKER","face":"🧑‍🍳","heading":"A kind old baker.","voiceText":"He rose before the sun, kneaded warm dough with his hands, and hummed the same old tune his mother once sang."}'>
    <div class="warm-glow" data-slot="warmGlow" data-user-hideable="true"></div>
    <div class="portrait"><div class="face" data-slot="face">🧑‍🍳</div></div>
    <div class="text-block">
      <div class="name" data-slot="name">THE BAKER</div>
      <div class="heading" data-slot="heading" data-user-editable="position">A kind old baker.</div>
      <div class="body-copy" data-slot="voiceText" data-user-editable="position">He rose before the sun, kneaded warm dough with his hands, and hummed the same old tune his mother once sang.</div>
    </div>
    <div class="fable-branding-name" data-slot="brandingName" data-user-editable="position" data-user-hideable="true" style="position:absolute; left:24px; bottom:24px; font:600 22px 'Inter Tight',sans-serif; color:#422006; text-shadow:0 1px 4px rgba(255,255,255,.5); z-index:50; pointer-events:none;"></div>
    <img class="fable-branding-logo" data-slot="brandingLogo" data-slot-type="image" data-slot-fit="contain" data-user-hideable="true" alt="" style="position:absolute; left:24px; bottom:54px; height:32px; width:auto; object-fit:contain; z-index:50; pointer-events:none;" />
  </div>
  <script>
    /* Fable boilerplate runtime (BOILERPLATE_SCRIPT_V3 = SLOT_INJECTOR_SCRIPT_V3 + OVERRIDES_SCRIPT_V3).
       Source of truth: src/shared/fable-pack/template-contract.ts. Do not edit by hand. */
(function(){
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

  // populate [data-slot="key"] — image-type slots get .src, everything else gets .textContent.
  Object.entries(V).forEach(([k, v]) => {
    if (k.startsWith('__')) return;
    document.querySelectorAll('[data-slot="' + k + '"]').forEach(el => {
      if (v == null) return;
      if (el.getAttribute('data-slot-type') === 'image') { el.src = String(v); }
      else { el.textContent = String(v); }
    });
  });

  // auto character badges
  ['characterName','leftName','rightName'].forEach(k => {
    if (!V[k]) return;
    if (!document.querySelector('[data-slot="' + k + '"]')) {
      const el = document.createElement('div');
      el.className = 'auto-char-badge auto-' + k;
      el.textContent = V[k];
      document.getElementById('root').appendChild(el);
    }
  });

  window.__timelines = window.__timelines || {};
  const cid = (document.getElementById('root') || {}).getAttribute && document.getElementById('root').getAttribute('data-composition-id') || 'default';
  window.__timelines[cid] = { start: function(){}, stop: function(){} };
})();

(function(){
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const O = V.__overrides || {};

  const ANCHOR = {
    'top-left':      { left:'0%',  top:'0%',   transform:'' },
    'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
    'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
    'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
    'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
    'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
    'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
    'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
  };

  Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
    const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
    if (!el) return;
    const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
    // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
    // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
    // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
    const w = el.getBoundingClientRect().width;
    // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
    // normal inline style (CSS cascade order: important author > animations > normal author), so
    // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
    const set = (prop, value) => el.style.setProperty(prop, value, 'important');
    if (w > 0) set('width', w + 'px');
    set('position', 'absolute');
    set('left', a.left);
    set('top', a.top);
    set('right', 'auto');
    set('bottom', 'auto');
    set('transform', a.transform || 'none');
    set('margin-left', (pos.offsetX||0) + 'px');
    set('margin-top', (pos.offsetY||0) + 'px');
  });

  (O.hiddenSlots || []).forEach(slotId => {
    document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
      .forEach(el => { el.style.display = 'none'; });
  });

  const img = O.image;
  if (img && img.assetPath) {
    let host = document.querySelector('[data-slot="fable-image"]');
    if (!host) {
      host = document.createElement('div');
      host.setAttribute('data-slot','fable-image');
      host.setAttribute('data-slot-type','image');
      Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
      document.getElementById('root').prepend(host);
    }
    const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
    const fit = img.fit || 'cover';
    host.innerHTML = '<img src="' + img.assetPath + '" style="width:100%;height:100%;object-fit:' + fit + ';opacity:' + opacity + '">';
    if (img.kenBurns) host.classList.add('fable-image-kenburns');
  }
})();
  </script>
</body>
</html>
