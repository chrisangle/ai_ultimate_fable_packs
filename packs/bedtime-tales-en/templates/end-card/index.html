<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Bedtime Tales · End Card · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink-cream: #fef3c7;
    --pack-eyebrow: #fbbf24;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #2d1b52 0%, #1a1330 60%, #0d0820 100%);
    color: var(--pack-ink-cream);
    font-family: "Fraunces", Georgia, serif;
  }
  .stars { position: absolute; inset: 0; overflow: hidden; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px rgba(255, 255, 255, 0.5); opacity: 0.75;
    animation: twinkle 3s ease-in-out infinite;
  }
  .star.slow { animation-duration: 5s; }
  .star.fast { animation-duration: 2s; }
  @keyframes twinkle {
    0%,100% { opacity: 0.75; }
    50%     { opacity: 0.25; }
  }
  .moon-small {
    position: absolute; left: 50%; top: 190px; transform: translateX(-50%);
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fef9c3 0%, #fde68a 60%, #ca8a04 100%);
    box-shadow: 0 0 60px rgba(254, 240, 138, 0.35);
    animation: moon-bob 8s ease-in-out infinite;
  }
  @keyframes moon-bob {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-10px); }
  }
  .the-end {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--pack-ink-cream);
    font-size: 168px; font-weight: 700; font-style: italic;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
    animation: fade-in 1.4s ease-out both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translate(-50%, -46%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  .sub {
    position: absolute; left: 50%; bottom: 240px; transform: translateX(-50%);
    color: var(--pack-eyebrow);
    font-size: 36px; font-weight: 500; letter-spacing: 6px; text-transform: uppercase;
  }
  .caption {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    color: #e9d5ff; font-size: 28px;
    max-width: calc(1920px - 2 * var(--pack-safe));
    text-align: center; font-style: italic;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="end-card"
       data-start="0"
       data-duration="6"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"endTitle":"The End","sub":"Sweet Dreams","voiceText":"Goodnight, little one. Rest well until tomorrow."}'>
    <div class="stars">
      <div class="star" style="left:8%; top:20%"></div>
      <div class="star slow" style="left:22%; top:65%; width:2px; height:2px;"></div>
      <div class="star" style="left:38%; top:12%"></div>
      <div class="star fast" style="left:70%; top:32%; width:4px; height:4px;"></div>
      <div class="star" style="left:82%; top:78%"></div>
      <div class="star" style="left:92%; top:15%"></div>
      <div class="star slow" style="left:14%; top:78%"></div>
    </div>
    <div class="moon-small"></div>
    <div class="the-end" data-slot="endTitle">The End</div>
    <div class="sub" data-slot="sub">Sweet Dreams</div>
    <div class="caption" data-slot="voiceText">Goodnight, little one. Rest well until tomorrow.</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines['end-card'] = {
        pause: function () {},
        seek:  function () {},
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
