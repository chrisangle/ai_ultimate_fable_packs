<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bedtime Tales — End Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');
  body { margin: 0; background: #1a1330; font-family: 'Fraunces', Georgia, serif; overflow: hidden; }
  .stage { width: 1920px; height: 1080px; position: relative;
    background: radial-gradient(ellipse at 50% 50%, #2d1b52 0%, #1a1330 60%, #0d0820 100%); }
  .moon-small {
    position: absolute; left: 50%; top: 190px; transform: translateX(-50%);
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fef9c3 0%, #fde68a 60%, #ca8a04 100%);
    box-shadow: 0 0 60px rgba(254,240,138,0.35);
  }
  .the-end {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #fef3c7; font-size: 168px; font-weight: 700; font-style: italic;
    text-shadow: 0 6px 30px rgba(0,0,0,0.6);
  }
  .sub {
    position: absolute; left: 50%; bottom: 240px; transform: translateX(-50%);
    color: #fbbf24; font-size: 36px; font-weight: 500; letter-spacing: 6px; text-transform: uppercase;
  }
  .caption {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    color: #e9d5ff; font-size: 28px; max-width: 1400px; text-align: center; font-style: italic;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .stars { position: absolute; inset: 0; overflow: hidden; }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.5); opacity: 0.75; }
</style>
</head>
<body>
  <div class="stage" data-composition-duration="6">
    <div class="stars">
      <div class="star" style="left:8%; top:20%"></div>
      <div class="star" style="left:22%; top:65%; width:2px; height:2px;"></div>
      <div class="star" style="left:38%; top:12%"></div>
      <div class="star" style="left:70%; top:32%; width:4px; height:4px;"></div>
      <div class="star" style="left:82%; top:78%"></div>
      <div class="star" style="left:92%; top:15%"></div>
      <div class="star" style="left:14%; top:78%"></div>
    </div>
    <div class="moon-small"></div>
    <div class="the-end" data-composition-variable="endTitle">The End</div>
    <div class="sub" data-composition-variable="sub">Sweet Dreams</div>
    <div class="caption" data-composition-variable="voiceText">Goodnight, little one. Rest well until tomorrow.</div>
  </div>
</body>
</html>
