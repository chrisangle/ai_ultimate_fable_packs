<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bedtime Tales — Storybook Page</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');
  body { margin: 0; background: #1a1330; font-family: 'Fraunces', Georgia, serif; overflow: hidden; }
  .stage { width: 1920px; height: 1080px; position: relative;
    background: linear-gradient(180deg, #fef3c7 0%, #fef9c3 50%, #fde68a 100%); }
  .paper {
    position: absolute; inset: 60px; border-radius: 20px;
    background: #fffbeb;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(180, 83, 9, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(180, 83, 9, 0.04) 0%, transparent 40%);
    box-shadow: 0 30px 80px rgba(120, 53, 15, 0.25), inset 0 0 100px rgba(180, 83, 9, 0.08);
  }
  .scene-number {
    position: absolute; top: 100px; left: 130px; font-size: 22px; letter-spacing: 6px;
    text-transform: uppercase; color: #92400e; font-weight: 500;
  }
  .illustration {
    position: absolute; left: 130px; top: 180px; width: 800px; height: 640px;
    border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #7dd3fc 0%, #86efac 100%);
    box-shadow: inset 0 0 60px rgba(6, 78, 59, 0.15);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .house {
    width: 300px; height: 240px; margin-bottom: 60px; position: relative;
  }
  .house .roof {
    width: 0; height: 0; margin: 0 auto;
    border-left: 170px solid transparent; border-right: 170px solid transparent;
    border-bottom: 130px solid #b45309;
  }
  .house .wall {
    width: 260px; height: 130px; margin: 0 auto; background: #fef3c7;
    border: 3px solid #92400e; border-top: none;
  }
  .house .door {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 70px; height: 100px; background: #7c2d12; border-radius: 35px 35px 0 0;
  }
  .house .window {
    position: absolute; top: 165px; width: 44px; height: 44px; background: #fde68a;
    border: 3px solid #92400e;
  }
  .house .window.left { left: 30px; }
  .house .window.right { right: 30px; }
  .tree {
    position: absolute; bottom: 30px; width: 100px; height: 220px;
  }
  .tree.left { left: 40px; }
  .tree.right { right: 40px; }
  .tree .trunk { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 22px; height: 90px; background: #78350f; }
  .tree .canopy { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 130px; background: #15803d; border-radius: 50%;
    box-shadow: inset 0 0 20px rgba(20, 83, 45, 0.4); }
  .text-block {
    position: absolute; right: 130px; top: 220px; width: 780px;
  }
  .heading { font-size: 52px; font-weight: 700; color: #78350f; margin-bottom: 30px; line-height: 1.2; }
  .body-copy { font-size: 34px; color: #422006; line-height: 1.55; font-weight: 500; }
  .page-number {
    position: absolute; bottom: 100px; right: 130px;
    font-size: 24px; color: #92400e; letter-spacing: 4px;
  }
</style>
</head>
<body>
  <div class="stage" data-composition-duration="10">
    <div class="paper">
      <div class="scene-number">Chapter <span data-composition-variable="order">1</span></div>
      <div class="illustration">
        <div class="tree left">
          <div class="canopy"></div><div class="trunk"></div>
        </div>
        <div class="tree right">
          <div class="canopy"></div><div class="trunk"></div>
        </div>
        <div class="house">
          <div class="roof"></div>
          <div class="wall"></div>
          <div class="window left"></div>
          <div class="window right"></div>
          <div class="door"></div>
        </div>
      </div>
      <div class="text-block">
        <div class="heading" data-composition-variable="heading">A cozy little house</div>
        <div class="body-copy" data-composition-variable="voiceText">
          In a small village at the edge of the woods, there stood a warm little cottage where a kind old baker made bread every morning.
        </div>
      </div>
      <div class="page-number" data-composition-variable="order">page 1</div>
    </div>
  </div>
</body>
</html>
