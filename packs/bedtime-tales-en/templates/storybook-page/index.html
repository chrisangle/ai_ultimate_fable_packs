<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Bedtime Tales · Storybook Page · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink-dark: #78350f;
    --pack-ink-body: #422006;
    --pack-safe: 80px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #fef3c7 0%, #fef9c3 50%, #fde68a 100%);
    color: var(--pack-ink-body);
    font-family: "Fraunces", Georgia, serif;
  }
  .paper {
    position: absolute; inset: 60px; border-radius: 20px;
    background: #fffbeb;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(180, 83, 9, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(180, 83, 9, 0.04) 0%, transparent 40%);
    box-shadow: 0 30px 80px rgba(120, 53, 15, 0.25), inset 0 0 100px rgba(180, 83, 9, 0.08);
    animation: page-turn 0.9s ease-out both;
  }
  @keyframes page-turn {
    from { transform: rotateY(-10deg) scale(0.98); opacity: 0; }
    to   { transform: rotateY(0)      scale(1);    opacity: 1; }
  }
  .scene-number {
    position: absolute; top: 100px; left: 130px;
    font-size: 22px; letter-spacing: 6px; text-transform: uppercase;
    color: #92400e; font-weight: 500;
  }
  .illustration {
    position: absolute; left: 130px; top: 180px; width: 800px; height: 640px;
    border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #7dd3fc 0%, #86efac 100%);
    box-shadow: inset 0 0 60px rgba(6, 78, 59, 0.15);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .house { width: 300px; height: 240px; margin-bottom: 60px; position: relative; animation: sway 5s ease-in-out infinite; }
  @keyframes sway {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  .house .roof {
    width: 0; height: 0; margin: 0 auto;
    border-left: 170px solid transparent; border-right: 170px solid transparent;
    border-bottom: 130px solid #b45309;
  }
  .house .wall {
    width: 260px; height: 130px; margin: 0 auto;
    background: #fef3c7; border: 3px solid #92400e; border-top: none;
  }
  .house .door {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 70px; height: 100px; background: #7c2d12; border-radius: 35px 35px 0 0;
  }
  .house .window {
    position: absolute; top: 165px; width: 44px; height: 44px;
    background: #fde68a; border: 3px solid #92400e;
  }
  .house .window.left { left: 30px; }
  .house .window.right { right: 30px; }
  .tree { position: absolute; bottom: 30px; width: 100px; height: 220px; }
  .tree.left { left: 40px; }
  .tree.right { right: 40px; }
  .tree .trunk {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 22px; height: 90px; background: #78350f;
  }
  .tree .canopy {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 130px; background: #15803d; border-radius: 50%;
    box-shadow: inset 0 0 20px rgba(20, 83, 45, 0.4);
    animation: rustle 4s ease-in-out infinite;
  }
  @keyframes rustle {
    0%,100% { transform: translateX(-50%) rotate(-2deg); }
    50%     { transform: translateX(-50%) rotate(2deg); }
  }
  .text-block { position: absolute; right: 130px; top: 220px; width: 780px; }
  .heading {
    font-size: 52px; font-weight: 700; color: var(--pack-ink-dark);
    margin-bottom: 30px; line-height: 1.2;
  }
  .body-copy {
    font-size: 34px; color: var(--pack-ink-body); line-height: 1.55; font-weight: 500;
  }
  .page-number {
    position: absolute; bottom: 100px; right: 130px;
    font-size: 24px; color: #92400e; letter-spacing: 4px;
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="storybook-page"
       data-start="0"
       data-duration="10"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"order":"1","heading":"A cozy little house","voiceText":"In a small village at the edge of the woods, there stood a warm little cottage where a kind old baker made bread every morning."}'>
    <div class="paper">
      <div class="scene-number" data-slot="chapterNumber" data-user-hideable="true">Chapter <span data-slot="order">1</span></div>
      <div class="illustration">
        <div class="tree left"><div class="canopy"></div><div class="trunk"></div></div>
        <div class="tree right"><div class="canopy"></div><div class="trunk"></div></div>
        <div class="house">
          <div class="roof"></div>
          <div class="wall"></div>
          <div class="window left"></div>
          <div class="window right"></div>
          <div class="door"></div>
        </div>
      </div>
      <div class="text-block">
        <div class="heading" data-slot="heading" data-user-editable="position">A cozy little house</div>
        <div class="body-copy" data-slot="voiceText" data-user-editable="position">
          In a small village at the edge of the woods, there stood a warm little cottage where a kind old baker made bread every morning.
        </div>
      </div>
      <div class="page-number">page <span data-slot="order">1</span></div>
    </div>
  </div>
  <script>
(function(){
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

  // populate [data-slot="key"]
  Object.entries(V).forEach(([k, v]) => {
    if (k.startsWith('__')) return;
    document.querySelectorAll('[data-slot="' + k + '"]').forEach(el => { el.textContent = (v == null ? '' : String(v)); });
  });

  // auto character badges
  ['characterName','leftName','rightName'].forEach(k => {
    if (!V[k]) return;
    if (!document.querySelector('[data-slot="' + k + '"]')) {
      const el = document.createElement('div');
      el.className = 'auto-char-badge auto-' + k;
      el.textContent = V[k];
      document.getElementById('root').appendChild(el);
    }
  });

  // V3 — overrides
  const O = V.__overrides || {};

  const ANCHOR = {
    'top-left':      { left:'0%',  top:'0%',   transform:'' },
    'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
    'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
    'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
    'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
    'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
    'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
    'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
  };

  Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
    const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
    if (!el) return;
    const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
    Object.assign(el.style, { position:'absolute', left:a.left, top:a.top, transform:a.transform,
      marginLeft: (pos.offsetX||0) + 'px', marginTop: (pos.offsetY||0) + 'px' });
  });

  (O.hiddenSlots || []).forEach(slotId => {
    const el = document.querySelector('[data-slot="' + slotId + '"][data-user-hideable="true"]');
    if (el) el.style.display = 'none';
  });

  const img = O.image;
  if (img && img.assetPath) {
    let host = document.querySelector('[data-slot="fable-image"]');
    if (!host) {
      host = document.createElement('div');
      host.setAttribute('data-slot','fable-image');
      host.setAttribute('data-slot-type','image');
      Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
      document.getElementById('root').prepend(host);
    }
    const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
    const fit = img.fit || 'cover';
    host.innerHTML = '<img src="' + img.assetPath + '" style="width:100%;height:100%;object-fit:' + fit + ';opacity:' + opacity + '">';
    if (img.kenBurns) host.classList.add('fable-image-kenburns');
  }

  window.__timelines = window.__timelines || {};
  const cid = (document.getElementById('root') || {}).getAttribute && document.getElementById('root').getAttribute('data-composition-id') || 'default';
  window.__timelines[cid] = { start: function(){}, stop: function(){} };
})();
  </script>
</body>
</html>
