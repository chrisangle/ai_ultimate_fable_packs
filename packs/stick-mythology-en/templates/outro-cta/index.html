<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0f172a; font-family: -apple-system, sans-serif; overflow: hidden; }
  .stage { width: 1920px; height: 1080px; position: relative;
    background: linear-gradient(180deg, #1a1a1a 0%, #7c2d12 100%); }
  .outro { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: white; font-size: 96px; font-weight: 800; text-align: center; max-width: 1500px;
    line-height: 1.15; }
  .cta { position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%);
    color: #fbbf24; font-size: 56px; font-weight: 700; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="stage" data-composition-id="outro-cta" data-duration="6">
    <div class="outro" data-composition-variable="voiceText">Thanks for watching.</div>
    <div class="cta" data-composition-variable="cta">SUBSCRIBE FOR MORE</div>
  </div>
</body>
</html>
