<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stick Mythology · Dialogue Panel · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink: #fef3c7;
    --pack-safe: 80px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #7c2d12 0%, #78350f 50%, #1c1917 100%);
    color: var(--pack-ink);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  }
  .stick-left  { position: absolute; bottom: 220px; left: 380px; }
  .stick-right { position: absolute; bottom: 220px; right: 380px; transform: scaleX(-1); }
  .bubble {
    position: absolute; padding: 24px 32px; border-radius: 24px;
    background: #fef3c7; color: #1c1917;
    font-size: 40px; font-weight: 600; line-height: 1.3;
    max-width: 620px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .bubble.left  { left: 300px;  bottom: 640px; border-bottom-left-radius: 6px; animation: pop-l 0.6s ease-out both; }
  .bubble.right { right: 300px; bottom: 640px; border-bottom-right-radius: 6px; animation: pop-r 0.6s ease-out both 1.2s; }
  .bubble.left::after {
    content: ''; position: absolute; bottom: -20px; left: 60px;
    border: 18px solid transparent; border-top: 22px solid #fef3c7; border-bottom: 0;
  }
  .bubble.right::after {
    content: ''; position: absolute; bottom: -20px; right: 60px;
    border: 18px solid transparent; border-top: 22px solid #fef3c7; border-bottom: 0;
  }
  @keyframes pop-l { from { opacity: 0; transform: translateY(12px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pop-r { from { opacity: 0; transform: translateY(12px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes idle {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  @keyframes idle-flip {
    0%,100% { transform: scaleX(-1) translateY(0); }
    50%     { transform: scaleX(-1) translateY(-6px); }
  }
  .stick-left  { animation: idle 3s ease-in-out infinite; }
  .stick-right { animation: idle-flip 3s ease-in-out infinite 1.5s; }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="dialogue-panel"
       data-start="0"
       data-duration="10"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"leftText":"Where are you going?","rightText":"To fetch the golden fleece."}'>
    <div class="bubble left"  data-slot="leftText">Where are you going?</div>
    <div class="bubble right" data-slot="rightText">To fetch the golden fleece.</div>
    <svg class="stick-left" width="220" height="380" viewBox="0 0 100 170" aria-hidden="true">
      <circle cx="50" cy="20" r="16" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <circle cx="45" cy="18" r="1.8" fill="#1c1917"/>
      <circle cx="55" cy="18" r="1.8" fill="#1c1917"/>
      <path d="M 44 26 Q 50 30 56 26" stroke="#1c1917" stroke-width="2" fill="none"/>
      <line x1="50" y1="36" x2="50" y2="105" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="55" x2="25" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="55" x2="75" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="105" x2="35" y2="150" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="105" x2="65" y2="150" stroke="#1c1917" stroke-width="4"/>
    </svg>
    <svg class="stick-right" width="220" height="380" viewBox="0 0 100 170" aria-hidden="true">
      <circle cx="50" cy="20" r="16" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <circle cx="45" cy="18" r="1.8" fill="#1c1917"/>
      <circle cx="55" cy="18" r="1.8" fill="#1c1917"/>
      <path d="M 42 24 Q 50 32 58 24" stroke="#1c1917" stroke-width="2" fill="none"/>
      <line x1="50" y1="36" x2="50" y2="105" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="55" x2="20" y2="65" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="55" x2="80" y2="65" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="105" x2="35" y2="150" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="105" x2="65" y2="150" stroke="#1c1917" stroke-width="4"/>
    </svg>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      // A. Populate declared [data-slot] elements verbatim.
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      // B. Auto-badge fallback — inject default character badge for reserved
      //    identity slots (characterName / leftName / rightName) when the
      //    value is set AND the template did not author its own placement.
      //    Docs: docs/pack-template-contract.md#character-identity.
      var root = document.getElementById('root');
      if (root) {
        ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
          var val = v[slot];
          if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
            var b = document.createElement('div');
            b.className = 'auto-char-badge auto-' + slot;
            b.textContent = String(val);
            root.appendChild(b);
          }
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['dialogue-panel'] = {
        pause: function () {}, seek: function () {}, paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
