<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stick Mythology · Hero Hook · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink: #fef3c7;
    --pack-accent-1: #f97316;
    --pack-accent-2: #fbbf24;
    --pack-stick-ink: #1c1917;
    --pack-stick-skin: #fde68a;
    --pack-safe: 80px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: radial-gradient(ellipse at center bottom, #f97316 0%, #7c2d12 45%, #1a1a1a 100%);
    color: var(--pack-ink);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  }
  .glow {
    position: absolute; left: 50%; bottom: -220px; transform: translateX(-50%);
    width: 1400px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(251,191,36,0.35), transparent 65%);
    filter: blur(60px);
    animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, -46%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-16px); }
  }
  @keyframes ticker {
    from { letter-spacing: 4px; opacity: 0; }
    to   { letter-spacing: 8px; opacity: 1; }
  }
  .kicker {
    position: absolute; top: 140px; left: 50%; transform: translateX(-50%);
    color: var(--pack-accent-2); font-size: 40px; font-weight: 700;
    letter-spacing: 8px; text-transform: uppercase;
    padding: 12px 32px;
    border: 2px solid var(--pack-accent-2); border-radius: 999px;
    animation: ticker 1s ease-out both;
  }
  .headline {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--pack-ink); font-size: 168px; font-weight: 900; line-height: 1.02;
    text-align: center;
    max-width: calc(1920px - 2 * var(--pack-safe));
    padding: 0 8px;
    text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .stickman {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%);
    animation: bob 3s ease-in-out infinite;
  }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="hero-hook"
       data-start="0"
       data-duration="8"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"kicker":"MYTHOLOGY","headline":"The Real Story"}'>
    <div class="glow"></div>
    <div class="kicker" data-slot="kicker">MYTHOLOGY</div>
    <div class="headline" data-slot="headline">The Real Story</div>
    <svg class="stickman" width="120" height="200" viewBox="0 0 100 170" aria-hidden="true">
      <circle cx="50" cy="20" r="16" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <circle cx="45" cy="18" r="1.8" fill="#1c1917"/>
      <circle cx="55" cy="18" r="1.8" fill="#1c1917"/>
      <path d="M 44 26 Q 50 30 56 26" stroke="#1c1917" stroke-width="2" fill="none"/>
      <line x1="50" y1="36" x2="50" y2="105" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="55" x2="25" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="55" x2="75" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="105" x2="35" y2="150" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="105" x2="65" y2="150" stroke="#1c1917" stroke-width="4"/>
    </svg>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines['hero-hook'] = {
        pause: function () {},
        seek:  function () {},
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
