<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stick Mythology · Narrator Scene · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink: #fef3c7;
    --pack-stick-ink: #1c1917;
    --pack-stick-skin: #fde68a;
    --pack-caption-bg: rgba(0, 0, 0, 0.72);
    --pack-safe: 80px;
  }
  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #f5e0b8 0%, #d97706 55%, #78350f 100%);
    color: var(--pack-ink);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  }
  .sun {
    position: absolute; top: 240px; left: 50%; transform: translateX(-50%);
    width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, #fef3c7 0%, #fde68a 40%, rgba(253,230,138,0) 70%);
    filter: blur(2px);
    animation: sway 8s ease-in-out infinite;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 220px;
    background: linear-gradient(180deg, rgba(28,25,23,0) 0%, rgba(28,25,23,0.35) 60%, rgba(28,25,23,0.6) 100%);
  }
  @keyframes sway {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-12px); }
  }
  @keyframes walk {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-10px); }
  }
  .stickman {
    position: absolute; bottom: 260px; left: 50%;
    animation: walk 2.4s ease-in-out infinite;
  }
  .caption {
    position: absolute;
    left: 50%; bottom: var(--pack-safe);
    transform: translateX(-50%);
    background: var(--pack-caption-bg); color: white;
    font-size: 44px; font-weight: 600; line-height: 1.32;
    padding: 20px 36px; border-radius: 14px;
    max-width: calc(1920px - 2 * var(--pack-safe));
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="narrator-scene"
       data-start="0"
       data-duration="10"
       data-width="1920"
       data-height="1080"
       data-composition-variables='{"voiceText":"Narrator caption placeholder."}'>
    <div class="sun"></div>
    <div class="ground"></div>
    <svg class="stickman" width="280" height="480" viewBox="0 0 100 170" aria-hidden="true">
      <circle cx="50" cy="20" r="16" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <circle cx="45" cy="18" r="1.8" fill="#1c1917"/>
      <circle cx="55" cy="18" r="1.8" fill="#1c1917"/>
      <path d="M 44 26 Q 50 30 56 26" stroke="#1c1917" stroke-width="2" fill="none"/>
      <line x1="50" y1="36" x2="50" y2="105" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="55" x2="25" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="55" x2="75" y2="75" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="105" x2="35" y2="150" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="105" x2="65" y2="150" stroke="#1c1917" stroke-width="4"/>
    </svg>
    <div class="caption" data-slot="voiceText">Narrator caption placeholder.</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      // A. Populate declared [data-slot] elements verbatim.
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      // B. Auto-badge fallback — inject default character badge for reserved
      //    identity slots (characterName / leftName / rightName) when the
      //    value is set AND the template did not author its own placement.
      //    Docs: docs/pack-template-contract.md#character-identity.
      var root = document.getElementById('root');
      if (root) {
        ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
          var val = v[slot];
          if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
            var b = document.createElement('div');
            b.className = 'auto-char-badge auto-' + slot;
            b.textContent = String(val);
            root.appendChild(b);
          }
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['narrator-scene'] = {
        pause: function () {}, seek: function () {}, paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
