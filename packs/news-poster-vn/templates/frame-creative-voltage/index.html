<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Creative Voltage · 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Dancing+Script:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /*
   * frame-creative-voltage — electric-blue / dark split with a hand-drawn script
   * accent. Vendored from nexu-io/html-video (Apache-2.0), adapted to HyperFrames
   * 0.6 (#root wrapper, slots via variables). Syne → Unbounded, Caveat → Dancing
   * Script (both VN-capable; Space Mono kept). Pure CSS/SVG @keyframes. See
   * NOTICE. Landscape 16:9 (blue left, dark right); 9:16 at compositions/portrait.html.
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; background: #0d0d14; color: #fff;
    font-family: 'Unbounded', sans-serif; }

  .panel-l { position: absolute; left: 0; top: 0; bottom: 0; width: 47%; background: #2f4bff;
    transform: translateX(-100%); animation: slideL 0.85s cubic-bezier(0.16,1,0.3,1) 0.1s forwards; }
  .panel-r { position: absolute; right: 0; top: 0; bottom: 0; width: 53%; background: #0d0d14;
    transform: translateX(100%); animation: slideR 0.85s cubic-bezier(0.16,1,0.3,1) 0.25s forwards; }
  @keyframes slideL { to { transform: translateX(0); } }
  @keyframes slideR { to { transform: translateX(0); } }

  .glow { position: absolute; left: 0; top: 0; bottom: 0; width: 47%; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.16) 0%, transparent 55%); opacity: 0;
    animation: fade 1.2s ease-out 0.9s forwards; }
  @keyframes fade { to { opacity: 1; } }

  .display { position: absolute; right: 110px; top: 300px; width: 820px; text-align: right; z-index: 4;
    font-weight: 800; font-size: 124px; line-height: 1.0; letter-spacing: -3px; }
  .display .ln { display: block; opacity: 0; transform: translateY(34px);
    animation: up 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
  .display .volt { color: #2f4bff; -webkit-text-stroke: 2px #6f86ff; }
  @keyframes up { to { opacity: 1; transform: translateY(0); } }

  .script { position: absolute; left: 90px; top: 430px; z-index: 4; font-family: 'Dancing Script', cursive;
    font-weight: 700; font-size: 150px; line-height: 0.9; color: #fff; opacity: 0; transform: rotate(-7deg);
    animation: scriptIn 0.8s ease-out 1.4s forwards; }
  @keyframes scriptIn { 0%{opacity:0;transform:rotate(-7deg) translateY(20px) scale(0.9)}
                        100%{opacity:1;transform:rotate(-7deg) translateY(0) scale(1)} }
  .script-underline { position: absolute; left: 90px; top: 600px; z-index: 4; }
  .script-underline path { stroke: #fff; stroke-width: 5; fill: none; stroke-linecap: round;
    stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 0.9s ease-out 1.9s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .meta { position: absolute; left: 90px; top: 96px; z-index: 4; font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.85);
    opacity: 0; animation: fade 0.6s ease-out 1.0s forwards; }

  .caption { position: absolute; right: 110px; bottom: 96px; z-index: 4; font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 400; letter-spacing: 2px; color: rgba(255,255,255,0.55);
    opacity: 0; animation: fade 0.6s ease-out 2.2s forwards; }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
  .fable-branding-name {
    position: absolute; left: 24px; bottom: 24px;
    font: 600 22px 'Unbounded',sans-serif;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    z-index: 50;
    pointer-events: none;
  }
  .fable-branding-logo {
    position: absolute; left: 24px; bottom: 54px;
    height: 32px;
    width: auto;
    object-fit: contain;
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1920"
    data-height="1080"
    data-composition-variables='{"meta":"// CHE_DO_SANG_TAO · ON","display_lines":["Dựng","mọi","video."],"accent_index":1,"script":"làm nó chạy","caption":"AI Coding · creative voltage"}'
  >
    <div class="panel-l"></div>
    <div class="panel-r"></div>
    <div class="glow" data-slot="glow" data-user-hideable="true"></div>

    <div class="meta" data-slot="metaLine" data-user-editable="position" data-user-hideable="true"></div>

    <div class="display" data-slot="textBlock" data-user-editable="position"></div>

    <div class="script" data-slot="scriptAccent" data-user-hideable="true"></div>
    <svg class="script-underline" data-slot="scriptAccent" data-user-hideable="true" width="520" height="60" viewBox="0 0 520 60" fill="none">
      <path d="M8 40 C 140 12, 360 12, 512 34"/>
    </svg>

    <div class="caption" data-slot="captionLine" data-user-editable="position" data-user-hideable="true"></div>

    <div class="fable-branding-name" data-slot="brandingName" data-user-editable="position" data-user-hideable="true"></div>
    <img class="fable-branding-logo" data-slot="brandingLogo" data-slot-type="image" data-slot-fit="contain" data-user-hideable="true" alt="" />
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes &&
               typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var set = function (sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };
      set('[data-slot="brandingName"]', v.brandingName);
      var brandingLogoEl = document.querySelector('[data-slot="brandingLogo"]');
      if (brandingLogoEl && v.brandingLogo) brandingLogoEl.src = v.brandingLogo;
      set(".meta", v.meta);
      set(".script", v.script);
      set(".caption", v.caption);
      var lines = Array.isArray(v.display_lines) ? v.display_lines : [];
      var ai = typeof v.accent_index === "number" ? v.accent_index : 1;
      var disp = document.querySelector(".display");
      if (disp) {
        disp.textContent = "";
        lines.forEach(function (t, i) {
          var span = document.createElement("span");
          span.className = "ln" + (i === ai ? " volt" : "");
          span.textContent = String(t);
          span.style.animationDelay = (1.0 + i * 0.18).toFixed(2) + "s";
          disp.appendChild(span);
        });
      }
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
  <script>
    /* Way Y — character identity fallback. Runs after the template's own
       injector; only touches the 3 reserved character-name slots. Empty-safe. */
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      var root = document.getElementById('root');
      if (!root) return;
      ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
        var val = v[slot];
        if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
          var b = document.createElement('div');
          b.className = 'auto-char-badge auto-' + slot;
          b.textContent = String(val);
          root.appendChild(b);
        }
      });
    })();
  </script>
  <script>
    /* Fable override runtime (OVERRIDES_SCRIPT_V3) — positions / hidden widgets / image slot.
       Source of truth: src/shared/fable-pack/template-contract.ts. Do not edit by hand. */
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const O = V.__overrides || {};
  
    const ANCHOR = {
      'top-left':      { left:'0%',  top:'0%',   transform:'' },
      'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
      'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
      'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
      'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
      'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
      'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
      'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
      'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    };
  
    Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
      const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
      if (!el) return;
      const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
      // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
      // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
      // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
      const w = el.getBoundingClientRect().width;
      // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
      // normal inline style (CSS cascade order: important author > animations > normal author), so
      // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
      const set = (prop, value) => el.style.setProperty(prop, value, 'important');
      if (w > 0) set('width', w + 'px');
      set('position', 'absolute');
      set('left', a.left);
      set('top', a.top);
      set('right', 'auto');
      set('bottom', 'auto');
      set('transform', a.transform || 'none');
      set('margin-left', (pos.offsetX||0) + 'px');
      set('margin-top', (pos.offsetY||0) + 'px');
    });
  
    (O.hiddenSlots || []).forEach(slotId => {
      document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
        .forEach(el => { el.style.display = 'none'; });
    });
  
    const img = O.image;
    if (img && img.assetPath) {
      let host = document.querySelector('[data-slot="fable-image"]');
      if (!host) {
        host = document.createElement('div');
        host.setAttribute('data-slot','fable-image');
        host.setAttribute('data-slot-type','image');
        Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
        document.getElementById('root').prepend(host);
      }
      const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
      const fit = img.fit || 'cover';
      host.innerHTML = '';
      var imgEl = document.createElement('img');
      imgEl.src = img.assetPath;
      Object.assign(imgEl.style, { width: '100%', height: '100%', objectFit: fit, opacity: opacity });
      host.appendChild(imgEl);
      if (img.kenBurns) host.classList.add('fable-image-kenburns');
    }
  })();
    </script>
</body>
</html>
