<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Logo Outro · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /*
   * frame-logo-outro — segmented logo assembly + glow bloom + tagline reveal.
   * Vendored from nexu-io/html-video (Apache-2.0), adapted to HyperFrames 0.6
   * (Tailwind CDN → plain CSS, Noto Sans SC dropped, slots via variables).
   * Inter Tight covers Vietnamese. See NOTICE. Landscape 16:9; 9:16 portrait
   * at compositions/portrait.html.
   */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1920px;
                height: 1080px;
                overflow: hidden;
            }
            #root {
                position: relative;
                width: 1920px;
                height: 1080px;
                background: radial-gradient(
                    circle at 50% 45%,
                    #1a1535 0%,
                    #08090c 70%
                );
                color: #f5f5f7;
                font-family: "Inter Tight", system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .accent {
                color: #7c5cff;
            }
            .ribbon {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 6px;
                background: #7c5cff;
            }

            @keyframes pieceIn {
                0% {
                    opacity: 0;
                    transform: scale(1.4) translate(var(--dx, 0), var(--dy, 0));
                }
                100% {
                    opacity: 1;
                    transform: scale(1) translate(0, 0);
                }
            }
            @keyframes glow {
                from {
                    filter: drop-shadow(0 0 0 transparent);
                }
                to {
                    filter: drop-shadow(0 0 40px rgba(124, 92, 255, 0.6));
                }
            }
            .logo-wrap {
                position: relative;
                width: 200px;
                height: 200px;
                animation: glow 0.8s ease-out 1.1s both;
            }
            .logo-wrap svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .piece {
                transform-box: fill-box;
                transform-origin: center;
                animation: pieceIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }
            .piece:nth-child(1) {
                --dx: -80px;
                --dy: -40px;
                animation-delay: 0s;
            }
            .piece:nth-child(2) {
                --dx: 60px;
                --dy: -50px;
                animation-delay: 0.08s;
            }
            .piece:nth-child(3) {
                --dx: -40px;
                --dy: 50px;
                animation-delay: 0.16s;
            }
            .piece:nth-child(4) {
                --dx: 0;
                --dy: -70px;
                animation-delay: 0.24s;
            }
            .piece:nth-child(5) {
                --dx: 70px;
                --dy: 40px;
                animation-delay: 0.32s;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .brand {
                margin-top: 48px;
                font-weight: 900;
                letter-spacing: -2px;
                line-height: 0.95;
                font-size: 104px;
                text-align: center;
                max-width: 1400px;
                animation: fadeUp 0.8s ease-out 1.4s both;
            }
            .tagline {
                margin-top: 22px;
                font-size: 32px;
                opacity: 0.72;
                font-weight: 500;
                text-align: center;
                max-width: 1100px;
                line-height: 1.35;
                animation: fadeUp 0.8s ease-out 1.7s both;
            }
            .meta {
                margin-top: 56px;
                display: flex;
                align-items: center;
                gap: 22px;
                font-size: 19px;
                text-transform: uppercase;
                letter-spacing: 4px;
                opacity: 0.55;
                font-weight: 500;
                animation: fadeUp 0.6s ease-out 2.1s both;
            }

            @keyframes shimmer {
                0% {
                    background-position: -200% 0;
                }
                100% {
                    background-position: 200% 0;
                }
            }
            .shimmer {
                background: linear-gradient(
                    120deg,
                    #f5f5f7 30%,
                    rgba(255, 255, 255, 0.45) 50%,
                    #f5f5f7 70%
                );
                background-size: 200% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shimmer 1.8s ease-out 1.9s 1 both;
            }

            .corner {
                position: absolute;
                bottom: 52px;
                font-size: 16px;
                font-family: "Inter", monospace;
                opacity: 0.32;
                text-transform: uppercase;
                letter-spacing: 4px;
                animation: fadeUp 0.6s ease-out 2.3s both;
            }
            .corner.left {
                left: 90px;
            }
            .corner.right {
                right: 90px;
            }
          /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
  .fable-branding-name {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    font: 600 16px 'Inter Tight',sans-serif;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    z-index: 50;
    pointer-events: none;
  }
  .fable-branding-logo {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    height: 18px;
    width: auto;
    object-fit: contain;
    z-index: 50;
    pointer-events: none;
  }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"brand_name":"","tagline":"Bản tin mới mỗi ngày","primary_url":""}'
        >
            <div class="ribbon" data-slot="ribbon" data-user-hideable="true"></div>

            <div class="logo-wrap">
                <svg viewBox="0 0 140 140" fill="none">
                    <!-- "</>" code glyph, assembled from 3 pieces -->
                    <path
                        class="piece"
                        d="M50 34 L22 70 L50 106"
                        stroke="#7c5cff"
                        stroke-width="14"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        class="piece"
                        d="M80 26 L60 114"
                        stroke="#f5f5f7"
                        stroke-width="14"
                        stroke-linecap="round"
                    />
                    <path
                        class="piece"
                        d="M90 34 L118 70 L90 106"
                        stroke="#7c5cff"
                        stroke-width="14"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>

            <h1 class="brand"><span class="shimmer"></span></h1>
            <p class="tagline"></p>
            <div class="meta" data-slot="metaUrl" data-user-hideable="true"><span class="meta-url"></span></div>

            <div class="corner left" data-slot="cornerLabels" data-user-hideable="true"></div>
            <div class="corner right" data-slot="cornerLabels" data-user-hideable="true">Bye Các Con Vợ</div>

            <div class="fable-branding-name" data-slot="brandingName" data-user-editable="position" data-user-hideable="true"></div>
            <img class="fable-branding-logo" data-slot="brandingLogo" data-slot-type="image" data-slot-fit="contain" data-user-hideable="true" alt="" />
        </div>

        <script>
            (function () {
                var v =
                    window.__hyperframes &&
                    typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                set('[data-slot="brandingName"]', v.brandingName);
                var brandingLogoEl = document.querySelector('[data-slot="brandingLogo"]');
                if (brandingLogoEl && v.brandingLogo) brandingLogoEl.src = v.brandingLogo;
                set(".brand .shimmer", v.brand_name);
                set(".tagline", v.tagline);
                set(".meta-url", v.primary_url);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () {
                    return true;
                },
            };
        </script>
      <script>
    /* Way Y — character identity fallback. Runs after the template's own
       injector; only touches the 3 reserved character-name slots. Empty-safe. */
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      var root = document.getElementById('root');
      if (!root) return;
      ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
        var val = v[slot];
        if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
          var b = document.createElement('div');
          b.className = 'auto-char-badge auto-' + slot;
          b.textContent = String(val);
          root.appendChild(b);
        }
      });
    })();
  </script>
  <script>
    /* Fable override runtime (OVERRIDES_SCRIPT_V3) — positions / hidden widgets / image slot.
       Source of truth: src/shared/fable-pack/template-contract.ts. Do not edit by hand. */
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const O = V.__overrides || {};
  
    const ANCHOR = {
      'top-left':      { left:'0%',  top:'0%',   transform:'' },
      'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
      'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
      'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
      'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
      'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
      'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
      'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
      'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    };
  
    Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
      const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
      if (!el) return;
      const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
      // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
      // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
      // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
      const w = el.getBoundingClientRect().width;
      // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
      // normal inline style (CSS cascade order: important author > animations > normal author), so
      // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
      const set = (prop, value) => el.style.setProperty(prop, value, 'important');
      if (w > 0) set('width', w + 'px');
      set('position', 'absolute');
      set('left', a.left);
      set('top', a.top);
      set('right', 'auto');
      set('bottom', 'auto');
      set('transform', a.transform || 'none');
      set('margin-left', (pos.offsetX||0) + 'px');
      set('margin-top', (pos.offsetY||0) + 'px');
    });
  
    (O.hiddenSlots || []).forEach(slotId => {
      document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
        .forEach(el => { el.style.display = 'none'; });
    });
  
    const img = O.image;
    if (img && img.assetPath) {
      let host = document.querySelector('[data-slot="fable-image"]');
      if (!host) {
        host = document.createElement('div');
        host.setAttribute('data-slot','fable-image');
        host.setAttribute('data-slot-type','image');
        Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
        document.getElementById('root').prepend(host);
      }
      const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
      const fit = img.fit || 'cover';
      host.innerHTML = '';
      var imgEl = document.createElement('img');
      imgEl.src = img.assetPath;
      Object.assign(imgEl.style, { width: '100%', height: '100%', objectFit: fit, opacity: opacity });
      host.appendChild(imgEl);
      if (img.kenBurns) host.classList.add('fable-image-kenburns');
    }
  })();
    </script>
</body>
</html>
