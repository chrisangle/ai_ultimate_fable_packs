<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Vignelli Stat · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap"
            rel="stylesheet"
        />
        <style>
            /*
   * frame-vignelli — Massimo Vignelli editorial stat hero (charcoal + one red
   * accent column + heavy grotesque numerals). Distilled from nexu-io/html-video
   * "Vignelli" (Apache-2.0), rebuilt as a self-contained CSS @keyframes timeline
   * (no A-roll video, no captions). Archivo covers Vietnamese. See NOTICE.
   * Landscape 16:9; 9:16 lives at compositions/portrait.html.
   */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                background: transparent;
            }
            #root {
                position: relative;
                width: 1920px;
                height: 1080px;
                background: #1a1a1a;
                color: #fff;
                font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
            }

            .grid {
                position: absolute;
                inset: 0;
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                z-index: 1;
                opacity: 0;
                animation: fade 0.8s ease-out 0.2s forwards;
            }
            .grid .col {
                border-right: 1px solid rgba(255, 255, 255, 0.05);
            }

            .red-col {
                position: absolute;
                top: 0;
                right: 0;
                width: 200px;
                height: 100%;
                background: #cc0000;
                z-index: 2;
                transform: translateX(100%);
                animation: slideInR 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s
                    forwards;
            }
            @keyframes slideInR {
                to {
                    transform: translateX(0);
                }
            }

            .content {
                position: absolute;
                left: 110px;
                right: 320px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 5;
            }

            .kicker {
                display: flex;
                align-items: center;
                gap: 22px;
                margin-bottom: 38px;
                opacity: 0;
                animation: fadeUp 0.6s ease-out 0.8s forwards;
            }
            .kicker .bar {
                width: 64px;
                height: 8px;
                background: #cc0000;
            }
            .kicker .txt {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 5px;
                text-transform: uppercase;
                color: #fff;
            }

            .number {
                font-size: 340px;
                font-weight: 900;
                line-height: 0.8;
                letter-spacing: -12px;
                color: #ffb800;
                opacity: 0;
                transform: translateY(80px);
                animation: numUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
            }
            @keyframes numUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .label {
                font-size: 72px;
                font-weight: 700;
                text-transform: uppercase;
                color: #fff;
                line-height: 1.05;
                margin-top: 28px;
                max-width: 1000px;
                opacity: 0;
                transform: translateY(40px);
                animation: numUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.3s
                    forwards;
            }

            .note {
                font-size: 30px;
                font-weight: 500;
                color: #9a9a9a;
                line-height: 1.4;
                margin-top: 34px;
                max-width: 900px;
                opacity: 0;
                animation: fadeUp 0.8s ease-out 1.6s forwards;
            }

            .brand {
                position: absolute;
                left: 110px;
                bottom: 90px;
                z-index: 5;
            }
            .brand .mark {
                font-size: 34px;
                font-weight: 900;
                letter-spacing: 8px;
                text-transform: uppercase;
                color: #fff;
                opacity: 0;
                animation: fadeUp 0.6s ease-out 2s forwards;
            }
            .brand .underline {
                width: 280px;
                height: 8px;
                background: #cc0000;
                margin-top: 12px;
                transform-origin: left;
                transform: scaleX(0);
                animation: scaleXin 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s
                    forwards;
            }
            @keyframes scaleXin {
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes fade {
                to {
                    opacity: 1;
                }
            }
            @keyframes fadeUp {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
          /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
  .fable-branding-name {
    position: absolute; right: 24px; bottom: 24px;
    font: 600 22px 'Archivo',sans-serif;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    z-index: 50;
    pointer-events: none;
  }
  .fable-branding-logo {
    position: absolute; right: 24px; bottom: 54px;
    height: 32px;
    width: auto;
    object-fit: contain;
    z-index: 50;
    pointer-events: none;
  }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"Khảo sát · 2026","number":"62%","label":"Nội dung tĩnh mất hút","note":"Phần lớn người xem lướt qua nội dung tĩnh chỉ trong vài giây đầu.","brand":"AI Coding"}'
        >
            <div class="grid" data-slot="gridPattern" data-user-hideable="true">
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
            </div>
            <div class="red-col" data-slot="accentColumn" data-user-hideable="true"></div>

            <div class="content" data-slot="textBlock" data-user-editable="position">
                <div class="kicker">
                    <span class="bar"></span><span class="txt"></span>
                </div>
                <div class="number"></div>
                <div class="label"></div>
                <div class="note"></div>
            </div>

            <div class="brand" data-slot="brandMark" data-user-hideable="true">
                <div class="mark"></div>
                <div class="underline"></div>
            </div>

            <div class="fable-branding-name" data-slot="brandingName" data-user-editable="position" data-user-hideable="true"></div>
            <img class="fable-branding-logo" data-slot="brandingLogo" data-slot-type="image" data-slot-fit="contain" data-user-hideable="true" alt="" />
        </div>

        <script>
            (function () {
                var v =
                    window.__hyperframes &&
                    typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                set(".kicker .txt", v.kicker);
                set(".number", v.number);
                set(".label", v.label);
                set(".note", v.note);
                set(".brand .mark", v.brand);
                set('[data-slot="brandingName"]', v.brandingName);
                var brandingLogoEl = document.querySelector('[data-slot="brandingLogo"]');
                if (brandingLogoEl && v.brandingLogo) brandingLogoEl.src = v.brandingLogo;

                /* Auto-scale to prevent overflow */
                var fitText = function (el, maxPx, minPx) {
                    if (!el || !el.textContent.trim()) return;
                    el.style.whiteSpace = "nowrap";
                    el.style.fontSize = maxPx + "px";
                    if (el.scrollWidth > el.offsetWidth) {
                        var sized = Math.max(minPx, Math.floor(maxPx * el.offsetWidth / el.scrollWidth));
                        el.style.fontSize = sized + "px";
                    }
                    el.style.whiteSpace = "";
                };
                fitText(document.querySelector(".number"), 340, 80);
                fitText(document.querySelector(".label"), 72, 28);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () {
                    return true;
                },
            };
        </script>
      <script>
    /* Way Y — character identity fallback. Runs after the template's own
       injector; only touches the 3 reserved character-name slots. Empty-safe. */
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      var root = document.getElementById('root');
      if (!root) return;
      ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
        var val = v[slot];
        if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
          var b = document.createElement('div');
          b.className = 'auto-char-badge auto-' + slot;
          b.textContent = String(val);
          root.appendChild(b);
        }
      });
    })();
  </script>
  <script>
    /* Fable override runtime (OVERRIDES_SCRIPT_V3) — positions / hidden widgets / image slot.
       Source of truth: src/shared/fable-pack/template-contract.ts. Do not edit by hand. */
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const O = V.__overrides || {};
  
    const ANCHOR = {
      'top-left':      { left:'0%',  top:'0%',   transform:'' },
      'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
      'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
      'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
      'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
      'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
      'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
      'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
      'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    };
  
    Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
      const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
      if (!el) return;
      const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
      // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
      // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
      // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
      const w = el.getBoundingClientRect().width;
      // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
      // normal inline style (CSS cascade order: important author > animations > normal author), so
      // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
      const set = (prop, value) => el.style.setProperty(prop, value, 'important');
      if (w > 0) set('width', w + 'px');
      set('position', 'absolute');
      set('left', a.left);
      set('top', a.top);
      set('right', 'auto');
      set('bottom', 'auto');
      set('transform', a.transform || 'none');
      set('margin-left', (pos.offsetX||0) + 'px');
      set('margin-top', (pos.offsetY||0) + 'px');
    });
  
    (O.hiddenSlots || []).forEach(slotId => {
      document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
        .forEach(el => { el.style.display = 'none'; });
    });
  
    const img = O.image;
    if (img && img.assetPath) {
      let host = document.querySelector('[data-slot="fable-image"]');
      if (!host) {
        host = document.createElement('div');
        host.setAttribute('data-slot','fable-image');
        host.setAttribute('data-slot-type','image');
        Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
        document.getElementById('root').prepend(host);
      }
      const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
      const fit = img.fit || 'cover';
      host.innerHTML = '<img src="' + img.assetPath + '" style="width:100%;height:100%;object-fit:' + fit + ';opacity:' + opacity + '">';
      if (img.kenBurns) host.classList.add('fable-image-kenburns');
    }
  })();
    </script>
</body>
</html>
