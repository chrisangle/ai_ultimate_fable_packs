<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #f5e0b8; font-family: -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { width: 1080px; height: 1920px; position: relative; background: #f5e0b8; }
  .kicker { position: absolute; top: 180px; left: 50%; transform: translateX(-50%);
    background: #dc2626; color: white; font-size: 40px; font-weight: 800; letter-spacing: 4px;
    padding: 14px 32px; border-radius: 8px; }
  .headline { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: #1c1917; font-size: 128px; font-weight: 900; text-align: center; line-height: 1.05;
    max-width: 940px; }
  .doodle-char { position: absolute; bottom: 300px; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>
  <div class="stage">
    <div class="kicker" data-composition-variable="kicker">BÍ MẬT</div>
    <div class="headline" data-composition-variable="headline">Tại sao bạn thất bại?</div>
    <svg class="doodle-char" width="240" height="360" viewBox="0 0 100 140">
      <circle cx="50" cy="30" r="22" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <path d="M 42 38 Q 50 34 58 38" stroke="#1c1917" stroke-width="2" fill="none"/>
      <ellipse cx="43" cy="28" rx="1.5" ry="3" fill="#1c1917"/>
      <ellipse cx="57" cy="28" rx="1.5" ry="3" fill="#1c1917"/>
      <line x1="50" y1="52" x2="50" y2="95" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="65" x2="30" y2="85" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="65" x2="70" y2="85" stroke="#1c1917" stroke-width="3"/>
      <line x1="50" y1="95" x2="35" y2="130" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="95" x2="65" y2="130" stroke="#1c1917" stroke-width="4"/>
    </svg>
  </div>
</body>
</html>
