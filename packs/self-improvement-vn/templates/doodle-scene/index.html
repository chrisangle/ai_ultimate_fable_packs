<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Tự Phát Triển · Doodle Scene · 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-bg: #f5e0b8;
    --pack-ink: #1c1917;
    --pack-caption-bg: rgba(28, 25, 23, 0.9);
    --pack-caption-ink: #fef3c7;
    --pack-doodle-ink: #1c1917;
    --pack-doodle-skin: #fde68a;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: var(--pack-bg);
    color: var(--pack-ink);
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
  }
  .lines {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 118px,
      rgba(28, 25, 23, 0.05) 118px,
      rgba(28, 25, 23, 0.05) 120px
    );
    pointer-events: none;
  }
  @keyframes float {
    0%,100% { transform: translate(-50%, 0); }
    50%     { transform: translate(-50%, -18px); }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .doodle-char {
    position: absolute; top: 28%; left: 50%;
    transform: translate(-50%, 0);
    animation: float 3.4s ease-in-out infinite;
  }
  .caption {
    position: absolute;
    bottom: 300px; left: var(--pack-safe); right: var(--pack-safe);
    background: var(--pack-caption-bg); color: var(--pack-caption-ink);
    font-size: 56px; font-weight: 700; line-height: 1.32;
    padding: 36px 44px; border-radius: 18px;
    text-align: center;
    box-shadow: 8px 8px 0 rgba(28, 25, 23, 0.15);
    animation: settle 0.7s ease-out both 0.4s;
  }
  .footer {
    position: absolute; bottom: var(--pack-safe); left: 0; right: 0;
    text-align: center;
    color: #78350f;
    font-size: 32px; font-weight: 600; letter-spacing: 6px;
    text-transform: uppercase;
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="doodle-scene"
       data-start="0"
       data-duration="10"
       data-width="1080"
       data-height="1920"
       data-composition-variables='{"voiceText":"Nội dung caption VN.","footer":"TỰ PHÁT TRIỂN"}'>
    <div class="lines"></div>
    <svg class="doodle-char" width="440" height="600" viewBox="0 0 100 140" aria-hidden="true">
      <circle cx="50" cy="30" r="22" fill="#fde68a" stroke="#1c1917" stroke-width="2.5"/>
      <path d="M 40 34 Q 50 40 60 34" stroke="#1c1917" stroke-width="2" fill="none"/>
      <circle cx="43" cy="27" r="2" fill="#1c1917"/>
      <circle cx="57" cy="27" r="2" fill="#1c1917"/>
      <line x1="50" y1="52" x2="50" y2="95" stroke="#1c1917" stroke-width="4"/>
      <path d="M 50 65 Q 25 60 20 80" stroke="#1c1917" stroke-width="3" fill="none"/>
      <path d="M 50 65 Q 75 60 80 80" stroke="#1c1917" stroke-width="3" fill="none"/>
      <line x1="50" y1="95" x2="35" y2="130" stroke="#1c1917" stroke-width="4"/>
      <line x1="50" y1="95" x2="65" y2="130" stroke="#1c1917" stroke-width="4"/>
    </svg>
    <div class="caption" data-slot="voiceText">Nội dung caption VN.</div>
    <div class="footer" data-slot="footer">TỰ PHÁT TRIỂN</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      // A. Populate declared [data-slot] elements verbatim.
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      // B. Auto-badge fallback — inject default character badge for reserved
      //    identity slots (characterName / leftName / rightName) when the
      //    value is set AND the template did not author its own placement.
      //    Docs: docs/pack-template-contract.md#character-identity.
      var root = document.getElementById('root');
      if (root) {
        ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
          var val = v[slot];
          if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
            var b = document.createElement('div');
            b.className = 'auto-char-badge auto-' + slot;
            b.textContent = String(val);
            root.appendChild(b);
          }
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['doodle-scene'] = {
        pause: function () {}, seek: function () {}, paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
