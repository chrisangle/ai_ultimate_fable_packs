<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Tự Phát Triển · Checklist Panel · 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-bg: #f5e0b8;
    --pack-ink: #1c1917;
    --pack-accent-1: #dc2626;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: var(--pack-bg);
    color: var(--pack-ink);
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
  }
  .lines {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 118px,
      rgba(28, 25, 23, 0.05) 118px, rgba(28, 25, 23, 0.05) 120px);
    pointer-events: none;
  }
  @keyframes stamp {
    from { opacity: 0; transform: translateX(-50%) rotate(-4deg) scale(0.7); }
    to   { opacity: 1; transform: translateX(-50%) rotate(-2deg) scale(1); }
  }
  @keyframes item-in {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes check {
    from { stroke-dashoffset: 60; }
    to   { stroke-dashoffset: 0; }
  }
  .title {
    position: absolute; top: 220px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    background: var(--pack-accent-1); color: white;
    font-size: 52px; font-weight: 800; letter-spacing: 3px;
    padding: 20px 44px; border-radius: 12px;
    box-shadow: 8px 8px 0 rgba(28, 25, 23, 0.15);
    animation: stamp 0.7s ease-out both;
  }
  .items {
    position: absolute; top: 460px; left: var(--pack-safe); right: var(--pack-safe);
  }
  .item {
    display: flex; align-items: flex-start; gap: 32px;
    padding: 28px 0;
    font-size: 52px; font-weight: 700;
    color: var(--pack-ink); line-height: 1.25;
    border-bottom: 3px dashed rgba(28, 25, 23, 0.18);
    animation: item-in 0.7s ease-out both;
  }
  .item:nth-child(1) { animation-delay: 0.4s; }
  .item:nth-child(2) { animation-delay: 0.9s; }
  .item:nth-child(3) { animation-delay: 1.4s; }
  .item:nth-child(4) { animation-delay: 1.9s; }
  .item:last-child { border-bottom: none; }
  .item .box {
    flex: 0 0 76px; width: 76px; height: 76px; margin-top: 4px;
    border: 5px solid #1c1917; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: white;
  }
  .item .check {
    stroke: var(--pack-accent-1); stroke-width: 8; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: check 0.5s ease-out both;
  }
  .item:nth-child(1) .check { animation-delay: 0.9s; }
  .item:nth-child(2) .check { animation-delay: 1.4s; }
  .item:nth-child(3) .check { animation-delay: 1.9s; }
  .item:nth-child(4) .check { animation-delay: 2.4s; }
  .footer {
    position: absolute; bottom: var(--pack-safe); left: 0; right: 0;
    text-align: center;
    color: #78350f;
    font-size: 32px; font-weight: 600; letter-spacing: 6px;
    text-transform: uppercase;
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="checklist-panel"
       data-start="0"
       data-duration="10"
       data-width="1080"
       data-height="1920"
       data-composition-variables='{"title":"CHECKLIST HÔM NAY","item1":"Ngủ đủ 7 tiếng","item2":"Uống 2 lít nước","item3":"30 phút vận động","item4":"Ghi 3 điều biết ơn"}'>
    <div class="lines" data-slot="paperLines" data-user-hideable="true"></div>
    <div class="title" data-user-editable="position" data-slot="title">CHECKLIST HÔM NAY</div>
    <div class="items">
      <div class="item">
        <div class="box"><svg width="52" height="52" viewBox="0 0 60 60"><path class="check" d="M 10 32 L 25 46 L 50 14"/></svg></div>
        <div data-slot="item1">Ngủ đủ 7 tiếng</div>
      </div>
      <div class="item">
        <div class="box"><svg width="52" height="52" viewBox="0 0 60 60"><path class="check" d="M 10 32 L 25 46 L 50 14"/></svg></div>
        <div data-slot="item2">Uống 2 lít nước</div>
      </div>
      <div class="item">
        <div class="box"><svg width="52" height="52" viewBox="0 0 60 60"><path class="check" d="M 10 32 L 25 46 L 50 14"/></svg></div>
        <div data-slot="item3">30 phút vận động</div>
      </div>
      <div class="item">
        <div class="box"><svg width="52" height="52" viewBox="0 0 60 60"><path class="check" d="M 10 32 L 25 46 L 50 14"/></svg></div>
        <div data-slot="item4">Ghi 3 điều biết ơn</div>
      </div>
    </div>
    <div class="footer" data-slot="footer" data-user-hideable="true">TỰ PHÁT TRIỂN</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      // A. Populate declared [data-slot] elements verbatim.
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      // B. Auto-badge fallback — inject default character badge for reserved
      //    identity slots (characterName / leftName / rightName) when the
      //    value is set AND the template did not author its own placement.
      //    Docs: docs/pack-template-contract.md#character-identity.
      var root = document.getElementById('root');
      if (root) {
        ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
          var val = v[slot];
          if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
            var b = document.createElement('div');
            b.className = 'auto-char-badge auto-' + slot;
            b.textContent = String(val);
            root.appendChild(b);
          }
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['checklist-panel'] = {
        pause: function () {}, seek: function () {}, paused: function () { return true; },
      };
    })();
  </script>
  <script>
    /* Fable override runtime (OVERRIDES_SCRIPT_V3) — positions / hidden widgets / image slot.
       Source of truth: src/shared/fable-pack/template-contract.ts. Do not edit by hand. */
  (function(){
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const O = V.__overrides || {};
  
    const ANCHOR = {
      'top-left':      { left:'0%',  top:'0%',   transform:'' },
      'top-center':    { left:'50%', top:'0%',   transform:'translateX(-50%)' },
      'top-right':     { left:'100%',top:'0%',   transform:'translateX(-100%)' },
      'middle-left':   { left:'0%',  top:'50%',  transform:'translateY(-50%)' },
      'middle-center': { left:'50%', top:'50%',  transform:'translate(-50%,-50%)' },
      'middle-right':  { left:'100%',top:'50%',  transform:'translate(-100%,-50%)' },
      'bottom-left':   { left:'0%',  top:'100%', transform:'translateY(-100%)' },
      'bottom-center': { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
      'bottom-safe':   { left:'50%', top:'100%', transform:'translate(-50%,-100%)' },
    };
  
    Object.entries(O.slotPositions || {}).forEach(([slotId, pos]) => {
      const el = document.querySelector('[data-slot="' + slotId + '"][data-user-editable="position"]');
      if (!el) return;
      const a = ANCHOR[pos.anchor] || ANCHOR['bottom-center'];
      // Freeze the CURRENT rendered width first: many slots are sized by "left + right" (a
      // full-width caption band), and re-anchoring has to drop 'right', which would otherwise
      // collapse the box to shrink-to-fit. Guarded on > 0 so a layout-less DOM (jsdom) is a no-op.
      const w = el.getBoundingClientRect().width;
      // Every property goes in as !important: a CSS animation with fill-mode 'both' OUTRANKS a
      // normal inline style (CSS cascade order: important author > animations > normal author), so
      // an animated slot would otherwise snap back to its keyframe transform and land off-frame.
      const set = (prop, value) => el.style.setProperty(prop, value, 'important');
      if (w > 0) set('width', w + 'px');
      set('position', 'absolute');
      set('left', a.left);
      set('top', a.top);
      set('right', 'auto');
      set('bottom', 'auto');
      set('transform', a.transform || 'none');
      set('margin-left', (pos.offsetX||0) + 'px');
      set('margin-top', (pos.offsetY||0) + 'px');
    });
  
    (O.hiddenSlots || []).forEach(slotId => {
      document.querySelectorAll('[data-slot="' + slotId + '"][data-user-hideable="true"]')
        .forEach(el => { el.style.display = 'none'; });
    });
  
    const img = O.image;
    if (img && img.assetPath) {
      let host = document.querySelector('[data-slot="fable-image"]');
      if (!host) {
        host = document.createElement('div');
        host.setAttribute('data-slot','fable-image');
        host.setAttribute('data-slot-type','image');
        Object.assign(host.style, { position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none' });
        document.getElementById('root').prepend(host);
      }
      const opacity = typeof img.opacity === 'number' ? img.opacity : 0.35;
      const fit = img.fit || 'cover';
      host.innerHTML = '<img src="' + img.assetPath + '" style="width:100%;height:100%;object-fit:' + fit + ';opacity:' + opacity + '">';
      if (img.kenBurns) host.classList.add('fable-image-kenburns');
    }
  })();
    </script>
</body>
</html>
