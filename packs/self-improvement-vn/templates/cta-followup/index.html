<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Tự Phát Triển · CTA Followup · 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink: #fef3c7;
    --pack-accent-1: #dc2626;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1a1a 0%, #78350f 100%);
    color: var(--pack-ink);
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
  }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, -42%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  @keyframes pulse-cta {
    0%,100% { transform: translateX(-50%) scale(1);    box-shadow: 0 0 0 rgba(220, 38, 38, 0.5); }
    50%     { transform: translateX(-50%) scale(1.03); box-shadow: 0 0 40px rgba(220, 38, 38, 0.6); }
  }
  .outro {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    color: var(--pack-ink);
    font-size: 84px; font-weight: 800; text-align: center;
    max-width: calc(1080px - 2 * var(--pack-safe));
    line-height: 1.15;
    animation: rise 1s ease-out both;
  }
  .cta {
    position: absolute; bottom: 380px; left: 50%; transform: translateX(-50%);
    background: var(--pack-accent-1); color: white;
    font-size: 56px; font-weight: 800; letter-spacing: 6px;
    text-transform: uppercase;
    padding: 26px 60px; border-radius: 14px;
    animation: pulse-cta 2.4s ease-in-out infinite 1.2s;
  }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="cta-followup"
       data-start="0"
       data-duration="6"
       data-width="1080"
       data-height="1920"
       data-composition-variables='{"voiceText":"Cảm ơn bạn đã xem.","cta":"THEO DÕI"}'>
    <div class="outro" data-slot="voiceText">Cảm ơn bạn đã xem.</div>
    <div class="cta" data-slot="cta">THEO DÕI</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines['cta-followup'] = {
        pause: function () {},
        seek:  function () {},
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
