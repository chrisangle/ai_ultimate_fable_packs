<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #1a1a1a; font-family: -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { width: 1080px; height: 1920px; position: relative;
    background: linear-gradient(180deg, #1a1a1a 0%, #78350f 100%); }
  .outro { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    color: #fef3c7; font-size: 84px; font-weight: 800; text-align: center; max-width: 900px;
    line-height: 1.2; }
  .cta { position: absolute; bottom: 380px; left: 50%; transform: translateX(-50%);
    background: #dc2626; color: white; font-size: 56px; font-weight: 800; letter-spacing: 4px;
    padding: 24px 48px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="stage" data-composition-id="cta-followup" data-duration="6">
    <div class="outro" data-composition-variable="voiceText">Cảm ơn bạn đã xem.</div>
    <div class="cta" data-composition-variable="cta">THEO DÕI</div>
  </div>
</body>
</html>
