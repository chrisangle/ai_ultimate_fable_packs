<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Tự Phát Triển · CTA Followup · 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --pack-ink: #fef3c7;
    --pack-accent-1: #dc2626;
    --pack-safe: 100px;
  }
  #root {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1a1a 0%, #78350f 100%);
    color: var(--pack-ink);
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
  }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, -42%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  @keyframes pulse-cta {
    0%,100% { transform: translateX(-50%) scale(1);    box-shadow: 0 0 0 rgba(220, 38, 38, 0.5); }
    50%     { transform: translateX(-50%) scale(1.03); box-shadow: 0 0 40px rgba(220, 38, 38, 0.6); }
  }
  .outro {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    color: var(--pack-ink);
    font-size: 84px; font-weight: 800; text-align: center;
    max-width: calc(1080px - 2 * var(--pack-safe));
    line-height: 1.15;
    animation: rise 1s ease-out both;
  }
  .cta {
    position: absolute; bottom: 380px; left: 50%; transform: translateX(-50%);
    background: var(--pack-accent-1); color: white;
    font-size: 56px; font-weight: 800; letter-spacing: 6px;
    text-transform: uppercase;
    padding: 26px 60px; border-radius: 14px;
    animation: pulse-cta 2.4s ease-in-out infinite 1.2s;
  }
  /* Character identity fallback — reserved slots {characterName / leftName /
     rightName}. Auto-injected by the boilerplate script when the value is
     present AND no <div data-slot="<name>"> authored the placement. Pack
     authors may override colors per template but MUST NOT rename the class. */
  .auto-char-badge {
    position: absolute; top: 60px;
    padding: 10px 26px;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: 7px;
    text-transform: uppercase; border-radius: 999px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }
  .auto-char-badge.auto-characterName { left: 50%; transform: translateX(-50%); }
  .auto-char-badge.auto-leftName      { left: 60px; }
  .auto-char-badge.auto-rightName     { right: 60px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="cta-followup"
       data-start="0"
       data-duration="6"
       data-width="1080"
       data-height="1920"
       data-composition-variables='{"voiceText":"Cảm ơn bạn đã xem.","cta":"THEO DÕI"}'>
    <div class="outro" data-slot="voiceText">Cảm ơn bạn đã xem.</div>
    <div class="cta" data-slot="cta">THEO DÕI</div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
        ? window.__hyperframes.getVariables() : {};
      // A. Populate declared [data-slot] elements verbatim.
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var key = el.getAttribute('data-slot');
        if (v[key] != null) el.textContent = String(v[key]);
      });
      // B. Auto-badge fallback — inject default character badge for reserved
      //    identity slots (characterName / leftName / rightName) when the
      //    value is set AND the template did not author its own placement.
      //    Docs: docs/pack-template-contract.md#character-identity.
      var root = document.getElementById('root');
      if (root) {
        ['characterName', 'leftName', 'rightName'].forEach(function (slot) {
          var val = v[slot];
          if (val && !document.querySelector('[data-slot="' + slot + '"]')) {
            var b = document.createElement('div');
            b.className = 'auto-char-badge auto-' + slot;
            b.textContent = String(val);
            root.appendChild(b);
          }
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['cta-followup'] = {
        pause: function () {}, seek: function () {}, paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
